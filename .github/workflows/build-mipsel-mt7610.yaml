name: build-mipsel-mt7610-cross

# Cross 版本编译 MIPSEL（mips32r2，MT7610）
# 重要：mipsel-unknown-linux-musl stable 无预编译 std，host 不要 rustup target add
# cross 在容器内部提供 std + 工具链
# MT7610：MIPS32R2、小端、无FPU，软浮点 musl

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  mipsel:
    name: linux-mipsel-mt7610-cross
    runs-on: ubuntu-22.04
    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: 安装 Rust + cross
        run: |
          rustup toolchain install stable
          # ✅ 删除 rustup target add mipsel-unknown-linux-musl，这一行是报错来源
          cargo install cross --version 0.2.5

      - name: 编译（cross 容器构建，静态 musl + mips32r2）
        env:
          RUSTFLAGS: "-C target-feature=+mips32r2,+crt-static"
        run: |
          cross build --release --target mipsel-unknown-linux-musl \
            -p nfrp-server -p nfrp-client

      - name: 安装 qemu-user-static 用于产物校验
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
          qemu-mipsel-static --version | head -1

      - name: 校验产物
        run: |
          set -euo pipefail
          D=target/mipsel-unknown-linux-musl/release
          file "$D/nfrp-server" "$D/nfrp-client"

          file "$D/nfrp-server" | grep -q 'MIPS, little-endian' \
            || { echo "架构不对，不是 mipsel"; exit 1; }

          file "$D/nfrp-server" | grep -Eq 'static-pie linked|statically linked' \
            || { echo "不是静态链接"; exit 1; }

          V=$(qemu-mipsel-static "$D/nfrp-server" -V)
          echo "server -V -> $V"
          echo "$V" | grep -q '^nfrp-server 0\.6\.' \
            || { echo "-V 输出不对"; exit 1; }

          P=$(qemu-mipsel-static "$D/nfrp-server" -v)
          echo "server -v -> $P"
          echo "$P" | grep -q '^0\.71\.0$' \
            || { echo "-v 必须输出裸协议版本 0.71.0（对齐官方 frp）"; exit 1; }

          qemu-mipsel-static "$D/nfrp-client" -V | grep -q '^nfrp-client 0\.6\.' \
            || { echo "client -V 输出不对"; exit 1; }

          echo "✅ cross 构建 mipsel-mt7610 产物，qemu 验证通过"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: nfrp-linux-mipsel-mt7610-cross
          path: |
            target/mipsel-unknown-linux-musl/release/nfrp-server
            target/mipsel-unknown-linux-musl/release/nfrp-client
          if-no-files-found: error
          retention-days: 30
