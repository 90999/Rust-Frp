name: build-arm64

# 为什么单独用一个 workflow 编 arm64：
#
# 本机与自建云主机都编不出来 —— arm64 的 LTO 链接峰值超过 2 GB，
# 而可用的机器只有 786 MB ~ 1.87 GB 内存，内核会直接把 rustc 杀掉
# （`signal: 9, SIGKILL`）。GitHub 的 runner 有 7 GB 内存，编得动。
#
# 产物只是 artifact，不直接发 Release —— 上传 Release 的凭据留在本地，
# 不让它进仓库。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  arm64:
    name: linux-arm64
    runs-on: ubuntu-22.04
    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: 装交叉工具链
        run: |
          sudo apt-get update
          # aarch64 的 gcc + 静态 glibc（+crt-static 需要后者的 .a）
          # qemu-user-static 用来在 x86 runner 上**真的跑一遍** arm64 产物 ——
          # 不跑就等于只证明了"能编出来"，证明不了"能运行"。
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user-static
          aarch64-linux-gnu-gcc --version | head -1
          qemu-aarch64-static --version | head -1

      - name: 装 Rust target
        run: |
          rustup target add aarch64-unknown-linux-gnu
          rustc --version
          cargo --version

      - name: 编译（静态链接）
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          # 与本地发版口径一致：优化尺寸 + 全静态，产物不依赖目标机 glibc
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu \
            -p nfrp-server -p nfrp-client

      - name: 校验产物
        run: |
          set -euo pipefail
          D=target/aarch64-unknown-linux-gnu/release
          file "$D/nfrp-server" "$D/nfrp-client"

          # 架构必须是 aarch64
          file "$D/nfrp-server" | grep -q 'ARM aarch64' \
            || { echo "架构不对"; exit 1; }

          # 必须是静态（`+crt-static` 产出的是 static-pie，也是全静态）
          file "$D/nfrp-server" | grep -Eq 'static-pie linked|statically linked' \
            || { echo "不是静态链接"; exit 1; }

          # ★ 用 qemu **真的执行**一遍：版本号与协议版本都得对
          #
          # 注意：不能在 x86 runner 上直接跑（会报 Exec format error），
          # 必须经 qemu-user-static 转译。
          V=$(qemu-aarch64-static "$D/nfrp-server" -V)
          echo "server -V -> $V"
          echo "$V" | grep -q '^nfrp-server 0\.6\.' \
            || { echo "-V 输出不对"; exit 1; }

          P=$(qemu-aarch64-static "$D/nfrp-server" -v)
          echo "server -v -> $P"
          echo "$P" | grep -q '^0\.71\.0$' \
            || { echo "-v 必须输出裸协议版本 0.71.0（对齐官方 frp）"; exit 1; }

          qemu-aarch64-static "$D/nfrp-client" -V | grep -q '^nfrp-client 0\.6\.' \
            || { echo "client -V 输出不对"; exit 1; }

          echo "✅ arm64 产物已在 qemu 下真实执行验证"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: nfrp-linux-arm64
          path: |
            target/aarch64-unknown-linux-gnu/release/nfrp-server
            target/aarch64-unknown-linux-gnu/release/nfrp-client
          if-no-files-found: error
          retention-days: 30
