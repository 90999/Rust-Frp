[package]
name = "nfrp-common"
description = "NFrp 公共库：协议、配置、错误、工具与传输层抽象"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"   # 用本 crate 的 README（根 README 含相对路径，crates.io 上会破图）
keywords = ["frp", "proxy", "tunnel", "protocol", "nat"]
categories = ["network-programming"]

[dependencies]
quinn = { workspace = true }
yamux = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rcgen = { workspace = true }
ring = { workspace = true }
libc = { workspace = true }
socket2 = { workspace = true }
webpki-roots = { workspace = true }

aes-gcm = { workspace = true }
aes = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }
hkdf = { workspace = true }
md-5 = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }

anyhow = { workspace = true }
bytes = { workspace = true }
snap = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
# pprof-rs 依赖 perf 信号与 nix，只在 Unix（Linux/macOS）可用；
# Windows 上 pprof_http 会返回明确的 501，而不是让整个 crate 编译失败。
pprof = { workspace = true }
