# cargo-deny 基线（第十轮 Stage 3）
#
# 目标不是“零告警”，而是把供应链检查变成可重复的门：
# - 有已知漏洞/恶意通告 ⇒ 失败；
# - 许可证必须是常见宽松/弱 copyleft 列表；
# - 禁止 wildcard 依赖与未知 registry/git 源。
#
# tokio 已升到 1.54.1；RUSTSEC-2026-0386（AsyncFd I/O safety）不再命中。
# 若未来某个依赖重新引入该版本，`cargo deny check` 会直接失败，不静默忽略。

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
